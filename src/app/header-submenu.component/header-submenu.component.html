<li class="menu-item" [class.open]="isOpen">
  <button class="menu-btn" type="button" (click)="onClick(node, $event)">
    <span *ngIf="node.flag" class="flag-container">
      <img [src]="node.flag" [alt]="node.nombre + ' flag'" class="flag-icon" />
    </span>

    <span class="label">{{ node.nombre }}</span>
    <span *ngIf="node.hijos?.length" class="caret">▸</span>
  </button>

  <ul *ngIf="node.hijos?.length" class="submenu">
    <ng-container *ngFor="let child of node.hijos">
      <app-header-submenu
        [node]="child"
        [isOpen]="openChildKey === keyOf(child)"
        (toggleOpen)="toggleChild($event)"
        (selected)="selected.emit($event)">
      </app-header-submenu>
    </ng-container>
  </ul>
</li>
