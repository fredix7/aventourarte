<li class="menu-item" [class.open]="isOpen" (pointerenter)="onPointerEnter($event)" (pointerleave)="onPointerLeave($event)" (keydown)="onKeydown($event)" (focusout)="onFocusOut($event)">
  <button
    #trigger
    *ngIf="node.hijos?.length; else guideLink"
    class="menu-btn"
    type="button"
    (click)="onClick(node, $event)"
    [attr.aria-expanded]="isOpen"
    [attr.aria-controls]="panelId"
  >
    <span *ngIf="node.flag" class="flag-container">
      <img [src]="node.flag" alt="" class="flag-icon" />
    </span>

    <span
      *ngIf="nodeIcon(node) as icon"
      class="material-icons menu-node-icon"
      [class.important-city-icon]="node.isImportantCity"
      aria-hidden="true"
    >{{ icon }}</span>
    <span class="label">{{ node.nombre }}</span>
    <span class="caret" aria-hidden="true">›</span>
  </button>

  <ng-template #guideLink>
    <a
      class="menu-btn"
      *ngIf="node.path"
      [routerLink]="'/guia/' + node.path"
      (click)="onSelected(node)"
    >
      <span *ngIf="node.flag" class="flag-container">
        <img [src]="node.flag" alt="" class="flag-icon" />
      </span>

      <span
        *ngIf="nodeIcon(node) as icon"
        class="material-icons menu-node-icon"
        [class.important-city-icon]="node.isImportantCity"
        aria-hidden="true"
      >{{ icon }}</span>
      <span class="label">{{ node.nombre }}</span>
    </a>
  </ng-template>

  <div #panel *ngIf="node.hijos?.length" class="submenu" [id]="panelId" [attr.inert]="!isOpen ? '' : null">
    <ul class="submenu-list" (scroll)="onPanelScroll($event)">
    <ng-container *ngFor="let child of node.hijos">
      <app-header-submenu
        [node]="child"
        [compact]="compact"
        [isOpen]="openChildKey === keyOf(child)"
        (toggleOpen)="toggleChild($event)"
        (selected)="selected.emit($event)">
      </app-header-submenu>
    </ng-container>
    </ul>
  </div>
</li>
